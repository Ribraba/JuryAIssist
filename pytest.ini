[pytest]
# Configuration pytest pour JuryAIssist

# Répertoires de recherche des tests
testpaths = tests

# Pattern de découverte des fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts =
    # Affichage verbeux
    -v
    # Afficher les print() statements
    -s
    # Afficher un résumé des tests
    --tb=short
    # Stopper au premier échec (décommenter si besoin)
    # -x
    # Couverture minimale requise
    --cov-fail-under=80
    # Ignorer les warnings de dépendances
    -W ignore::DeprecationWarning

# Marqueurs personnalisés pour catégoriser les tests
markers =
    unit: Tests unitaires (rapides, sans dépendances externes)
    integration: Tests d'intégration (avec dépendances réelles)
    hardware: Tests nécessitant du hardware (pédale USB)
    slow: Tests lents (> 1 seconde)
    gui: Tests de l'interface graphique (nécessitent QApplication)

# Configuration de la couverture
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
